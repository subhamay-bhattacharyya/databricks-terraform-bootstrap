name: Terraform Destroy
run-name: Terraform Destroy - ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to (e.g., devl, test, prod)"
        required: true
        type: environment
        default: devl


jobs:
  apply:
    name: 🚧 Run Terraform Destroy
    uses: subhamay-bhattacharyya-gha/terraform-destroy-wf/.github/workflows/terraform-destroy.yaml@main
    with:
      cloud-provider: "databricks"
      backend-type: remote
    secrets:
      tfc-token: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
      databricks-host: ${{ secrets.DATABRICKS_HOST }}
      databricks-token: ${{ secrets.DATABRICKS_TOKEN }}