name: Terraform CI - Databricks
run-name: Build run by ${{ github.actor }} on ${{ github.ref_name }}

on:
  push:
    branches:
      - 'main'
      - 'feature/**'
      - 'bug/**'
    paths:
      - infra/databricks/tf/**
  pull_request:
    branches: [ main ]
    paths:
      - infra/databricks/tf/**

permissions:
  contents: write
  id-token: write

jobs:
  # start-job:
  #   name: Start CI Workflow
  #   runs-on: ubuntu-latest
  #   steps:
  #     - name: Set CI Job Status
  #       id: set-ci-job-status
  #       run: |
  #         echo "ci-job-status=started" >> $GITHUB_OUTPUT

  # ============================================================================
  # Phase 1 & 2: Snowflake Core + Cloud Storage (Parallel)
  # ============================================================================
  
  databricks-core:
    name: Databricks
    # needs: start-job
    uses: subhamay-bhattacharyya-gha/tf-ci-reusable-wf/.github/workflows/ci.yaml@feature/GHA-0033-enhancement-add-snowflake
    with:
      cloud-provider: databricks
      tflint-ver: ${{ vars.TF_LINT_VER }}
      backend-type: remote
      terraform-dir: tf
      tf-vars-file: terraform.tfvars
    secrets:
      tfc-token: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
      databricks-host: ${{ secrets.DATABRICKS_HOST }}
      databricks-token: ${{ secrets.DATABRICKS_TOKEN }}

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: 
      - databricks-core
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    
    steps:
      - name: Create Release
        uses: subhamay-bhattacharyya-gha/create-release-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}